<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Trips (current)</h2>
    <button (click)="goToAddTrip()" class="btn btn-primary" type="button">
      Add Trip
    </button>
  </div>

  <div class="row" *ngIf="trips$ | async as trips; else loading">
    <div *ngFor="let trip of trips" class="col-12 col-md-4 mb-4">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>

  <ng-template #loading>
    <p>Loading trips...</p>
  </ng-template>
</div>
